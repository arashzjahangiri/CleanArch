networks:
  app-network:
    driver: bridge

services:
  # ASP.NET Core Web API Application
  shop-webapi:
    image: ${DOCKER_REGISTRY-}shop-webapi
    container_name: shop-webapi
    restart: always
    build:
      context: .
      dockerfile: src/Shop.PublicApi/Dockerfile
    expose:
      - 8080
    networks:
      - app-network
    # Wait for the dependencies to accept connections, not merely to have been created.
    depends_on:
      shop-sql-server:
        condition: service_healthy
      shop-mongo-server:
        condition: service_healthy
      shop-redis:
        condition: service_healthy

  # SQL Server
  shop-sql-server:
    image: mcr.microsoft.com/azure-sql-edge:latest
    cap_add: ["SYS_PTRACE"]
    hostname: mssql
    container_name: shop-sql-server
    restart: always
    expose:
      - 1433
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in your .env file}
      - MSSQL_PID=Developer
      - MSSQL_COLLATION=Latin1_General_CI_AI
    networks:
      - app-network
    volumes:
      # Mount the whole directory, not just data/: the image runs as the non-root "mssql" user and
      # must create its system databases itself. Mounting data/ alone leaves it unwritable.
      - data-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # MongoDB Server
  shop-mongo-server:
    image: mongo:latest
    container_name: shop-mongo-server
    restart: always
    expose:
      - 27017
    ports:
      - "27017:27017"
    networks:
      - app-network
    volumes:
      - data-mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Redis Cache Server
  shop-redis:
    image: redis:latest
    container_name: shop-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in your .env file}
    restart: always
    expose:
      - 6379
    ports:
      - "6379:6379"
    networks:
      - app-network
    volumes:
      - data-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

volumes:
  data-mssql:
  data-mongo:
  data-redis:
