services:
  shop-webapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      # Connection strings carry credentials, so they come from .env, never from appsettings.
      - ConnectionStrings__SqlConnection=Server=shop-sql-server;Initial Catalog=ShopContext;User Id=sa;Password=${MSSQL_SA_PASSWORD};Trusted_Connection=False;TrustServerCertificate=True;
      - ConnectionStrings__NoSqlConnection=mongodb://shop-mongo-server
      - ConnectionStrings__CacheConnection=shop-redis:6379,password=${REDIS_PASSWORD},abortConnect=false
    # Fixed host port so the documented URLs always work. Override with API_PORT in .env.
    ports:
      - "${API_PORT:-8080}:8080"
